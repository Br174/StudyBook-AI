name: StudyBook Android LAB APK

on:
  push:
    branches:
      - lab/studybook-core-android-01
      - lab/studybook-core-android-01-update-01
    paths:
      - 'src/**'
      - 'api/**'
      - 'worker/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: studybook-android-lab-01
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      STUDYBOOK_VERSION_CODE: ${{ github.run_number }}
      STUDYBOOK_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web core
        env:
          VITE_NATIVE_API_BASE: https://studybook-ai.brunoverlezza.workers.dev
        run: npm run build

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Download original LAB01 signing identity
        uses: actions/download-artifact@v4
        with:
          name: StudyBook-LAB01-signing-recovery
          path: signing-recovery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37467723184

      - name: Install and verify original LAB01 signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          cp signing-recovery/lab01-debug.keystore ~/.android/debug.keystore
          KEY_SHA=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n1)
          EXPECTED_SHA="D7:BB:93:15:C9:C4:35:18:72:49:54:78:61:0C:48:47:25:08:6E:2B:AB:BC:04:BE:C6:5E:C8:23:45:5F:BD:CC"
          test "$KEY_SHA" = "$EXPECTED_SHA"
          echo "LAB01 signing fingerprint verified: $KEY_SHA"

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/StudyBook-AI-LAB-01-UPDATE-01.apk"
          sha256sum "artifacts/StudyBook-AI-LAB-01-UPDATE-01.apk" > "artifacts/StudyBook-AI-LAB-01-UPDATE-01.sha256"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey |             grep -E 'SHA256:|Valid from:' > "artifacts/StudyBook-AI-LAB-01-UPDATE-01-signing.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-AI-LAB-01-UPDATE-01-APK
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
