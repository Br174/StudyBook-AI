          test "$STUDYBOOK_SIGNING_MODE" = update
          test "$STUDYBOOK_APPLICATION_ID" = it.studybook.ai.lab
          test -s "artifacts/${STUDYBOOK_ARTIFACT_BASENAME}.apk"
