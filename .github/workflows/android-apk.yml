          const base='https://studybook-ai-lab44.brunoverlezza.workers.dev';
          let ok=false;
          for(let i=0;i<12;i++){
            try {
              const response=await fetch(base+'/api/editions/v36',{method:'GET',signal:AbortSignal.timeout(12000)});
              if(response.status===405){ok=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,2500));
          }
          if(!ok)throw Error('LAB44 isolated Gemini route unavailable');
          console.log('LAB44_ISOLATED_WORKER_READY (LAB40, LAB39 and production untouched)');
