jobs:
  apk:
    # LAB72: never build/distribute untested intermediate commits.
    # Only explicit CI release-gate commit can run full Scudo360+Android.
    if: ${{ !startsWith(github.ref_name, 'lab/studybook-core-android-01-update-72-') || contains(github.event.head_commit.message, '[lab72-release-approved]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify active StudyBook Android signing family and Scudo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/motorlab-active-guard.mjs --self-test
          node scripts/motorlab-active-guard.mjs
      - name: Quality Guard LAB29 progressive reductions, source protection and library regression
        run: |
          node scripts/test-study-tools.mjs
          node scripts/test-precision-core.mjs
          node scripts/test-quality-guard-lab26.mjs
          node scripts/test-lab27-simple-metrics.mjs
          node scripts/test-library-reprocessing-lab28.mjs
          node scripts/test-lab29-progressive-reductions.mjs
          node scripts/test-lab30-continuous-narrative.mjs

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
