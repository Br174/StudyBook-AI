name: StudyBook Android LAB APK

on:
  push:
    branches:
      - lab/studybook-core-android-01
    paths:
      - 'src/**'
      - 'api/**'
      - 'worker/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: studybook-android-lab-01
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      STUDYBOOK_VERSION_CODE: ${{ github.run_number }}
      STUDYBOOK_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web core
        env:
          VITE_NATIVE_API_BASE: https://studybook-ai.brunoverlezza.workers.dev
        run: npm run build

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Restore LAB signing continuity
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: studybook-ai-lab01-debug-signing-v1

      - name: Create LAB signing key on first build
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v             -keystore ~/.android/debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=StudyBook AI LAB 01,O=StudyBook AI,C=IT"             -keyalg RSA -keysize 2048 -validity 10000

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/StudyBook-AI-LAB-01.apk"
          sha256sum "artifacts/StudyBook-AI-LAB-01.apk" > "artifacts/StudyBook-AI-LAB-01.sha256"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey |             grep -E 'SHA256:|Valid from:' > "artifacts/StudyBook-AI-LAB-01-signing.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-AI-LAB-01-APK
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
