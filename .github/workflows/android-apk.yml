        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.lab58tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          DATA=$(jq -nc --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg status "$TEST_OUTCOME" '{source_sha:$sha,run_id:($run|tonumber),tests:$status,device_test:"PENDING",comparison:"NO_GEMINI_QUOTA"}')
          BODY=$(printf '%s' "$DATA" | base64 -w0)
          TARGET=".motorlab/LAB58_TEST_RECEIPT.json"
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
          if [[ -n "$PREV" ]]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET" -f message="chore(LAB58): no-cost cadence test [skip ci]" -f branch="$GITHUB_REF_NAME" -f content="$BODY" -f sha="$PREV" >/dev/null
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET" -f message="chore(LAB58): no-cost cadence test [skip ci]" -f branch="$GITHUB_REF_NAME" -f content="$BODY" >/dev/null
