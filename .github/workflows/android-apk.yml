thub.ref_name, 'lab/studybook-core-android-01-update-57-') || (startsWith(github.ref_name, 'lab/studybook-core-android-01-update-58-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-59-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-60-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-61-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-62-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-63-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-65-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-66-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-67-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-68-') || startsWith(github.ref_name, 'lab/studybook-core-android-01-update-69-'))))
