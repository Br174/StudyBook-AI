name: Apply StudyBook AI v0.15 integration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-v15-upgrade.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v0.15 patch
        run: node scripts/apply-v15-upgrade.mjs
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV15.jsx src/main.jsx package.json README.md
          if git diff --cached --quiet; then
            echo "No v0.15 changes to commit"
          else
            git commit -m "feat: add scanner storage guard in v0.15"
            git push origin HEAD:main
          fi
