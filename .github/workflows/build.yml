name: Build StudyBook AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check API syntax
        run: node --check api/summarize.js && node --check api/refine.js && node --check api/explain.js
      - name: Build
        run: npm run build
