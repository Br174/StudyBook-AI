name: UAB-CORE StudyBook AI adapter

on:
  push:
    branches:
      - main
      - 'lab/**'
      - 'candidate/**'
      - 'mother/**'
    paths-ignore:
      - '.uab/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Progress 5% - accepted
        run: echo "[UAB_PROGRESS=5] StudyBook preso in carico da UAB-CORE-V1"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect lifecycle stage
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            mother/*) UAB_STAGE="MADRE" ;;
            candidate/*) UAB_STAGE="CANDIDATA" ;;
            lab/*) UAB_STAGE="LAB" ;;
            main) UAB_STAGE="BASE" ;;
            *) UAB_STAGE="CHECK" ;;
          esac
          echo "UAB_STAGE=$UAB_STAGE" >> "$GITHUB_ENV"
          echo "[UAB_PROGRESS=15] Stage=$UAB_STAGE; ciclo MADRE-LAB-CANDIDATA applicato"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Install dependencies
        run: |
          npm install --prefer-offline --no-audit --no-fund
          echo "[UAB_PROGRESS=30] Dipendenze pronte con cache persistente"

      - name: Check API syntax
        run: node --check api/summarize.js && node --check api/refine.js && node --check api/explain.js

      - name: Check Netlify functions syntax
        run: |
          node --check netlify/functions/_legacy-adapter.mjs && node --check netlify/functions/summarize.mjs && node --check netlify/functions/refine.mjs && node --check netlify/functions/explain.mjs
          echo "[UAB_PROGRESS=45] Controlli statici completati"

      - name: Test AI resilience
        run: node scripts/test-ai-resilience.mjs
      - name: Test long-paragraph engine
        run: node scripts/test-long-paragraph-engine.mjs
      - name: Test resumable OCR checkpoints
        run: node scripts/test-ocr-checkpoint.mjs
      - name: Test scanner session persistence
        run: node scripts/test-scanner-session-store.mjs
      - name: Test scanner storage protection
        run: node scripts/test-scanner-storage.mjs
      - name: Test study tools
        run: node scripts/test-study-tools.mjs
      - name: Test persistent study-help cache
        run: node scripts/test-study-help-cache-model.mjs
      - name: Test PWA shell
        run: node scripts/test-pwa.mjs

      - name: Progress 60% - tests complete
        run: echo "[UAB_PROGRESS=60] Cache pronta; test principali completati"

      - name: Stress test 600-page text pipeline
        run: node scripts/stress-large-book.mjs

      - name: Build
        run: |
          npm run build
          echo "[UAB_PROGRESS=75] Build web completata"

      - name: Verify dist
        run: |
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          echo "[UAB_PROGRESS=85] Output dist verificato"

      - name: Upload temporary LAB/CANDIDATA build output
        if: env.UAB_STAGE == 'LAB' || env.UAB_STAGE == 'CANDIDATA'
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-${{ env.UAB_STAGE }}-${{ github.run_number }}
          retention-days: 14
          path: dist/
          if-no-files-found: error

      - name: Upload deploy source for BASE/MADRE
        if: github.event_name == 'push' && (env.UAB_STAGE == 'BASE' || env.UAB_STAGE == 'MADRE')
        uses: actions/upload-artifact@v4
        with:
          name: studybook-ai-${{ env.UAB_STAGE }}-deploy-source
          retention-days: 3
          include-hidden-files: true
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**

      - name: Progress 95% - handoff ready
        run: echo "[UAB_PROGRESS=95] Output $UAB_STAGE pronto; nessuna promozione implicita eseguita"

      - name: Progress 100% - complete
        run: echo "[UAB_PROGRESS=100] StudyBook UAB-CORE-V1 completato per stage $UAB_STAGE"
