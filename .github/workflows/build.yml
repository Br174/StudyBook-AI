name: UAB-CORE StudyBook AI adapter

on:
  push:
    branches:
      - main
      - 'lab/**'
      - 'candidate/**'
      - 'mother/**'
    paths-ignore:
      - '.uab/**'
      - '.motorlab/**'
      - 'MOTORLAB_PROJECT_HOOK.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Progress 5% - accepted
        run: echo "[UAB_PROGRESS=5] StudyBook preso in carico da UAB-CORE-V1"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect lifecycle stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            mother/*) UAB_STAGE="MADRE" ;;
            candidate/*) UAB_STAGE="CANDIDATA" ;;
            lab/*) UAB_STAGE="LAB" ;;
            main) UAB_STAGE="BASE" ;;
            *) UAB_STAGE="CHECK" ;;
          esac
          echo "UAB_STAGE=$UAB_STAGE" >> "$GITHUB_ENV"
          echo "stage=$UAB_STAGE" >> "$GITHUB_OUTPUT"
          echo "[UAB_PROGRESS=15] Stage=$UAB_STAGE; ciclo MADRE-LAB-CANDIDATA applicato"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Install dependencies
        run: |
          npm install --prefer-offline --no-audit --no-fund
          echo "[UAB_PROGRESS=30] Dipendenze pronte con cache persistente"

      - name: Check API syntax
        run: node --check api/summarize.js && node --check api/refine.js && node --check api/explain.js

      - name: Check Cloudflare Worker syntax
        run: |
          node --check worker/index.js
          echo "[UAB_PROGRESS=45] Controlli statici completati"

      - name: Test AI resilience
        run: node scripts/test-ai-resilience.mjs
      - name: Test MotorLab Runtime r21
        run: node scripts/test-motorlab-runtime.mjs
      - name: Test fidelity gate
        run: node scripts/test-fidelity-engine.mjs
      - name: Test editorial model
        run: node scripts/test-editorial-model.mjs
      - name: Test glossary quality
        run: node scripts/test-glossary-quality.mjs
      - name: Test import/export format matrix
        run: node scripts/test-format-matrix.mjs
      - name: Test LAB update 01 UX
        run: node scripts/test-update-01-ux.mjs
      - name: Test LAB update 02 UX
        run: node scripts/test-update-02-ux.mjs
      - name: Test LAB06 approved layout and audio
        run: node scripts/test-lab06-ui.mjs
      - name: Test LAB07 Home Continua opens full book overview
        run: node scripts/test-lab07-home-continue.mjs
      - name: Test LAB08 Library Elaborati and clean book header
        run: node scripts/test-lab08-library-overview.mjs
      - name: Test LAB09 approved compact design and SVG icons
        run: node scripts/test-lab09-approved-ui.mjs
      - name: Test LAB10 universal interactive glossary
        run: node scripts/test-lab10-universal-glossary.mjs
      - name: Test LAB11 Scanner Turbo and persistent scanned-photo archive
        run: node scripts/test-lab11-scanner-turbo.mjs
      - name: Test LAB12 smart document naming and rename persistence
        run: node scripts/test-lab12-smart-titles.mjs
      - name: Test LAB13 original source and four-category library
        run: node scripts/test-lab13-original-library.mjs
      - name: Test Android native contract
        run: node scripts/test-native-contract.mjs
      - name: Test long-paragraph engine
        run: node scripts/test-long-paragraph-engine.mjs
      - name: Test resumable OCR checkpoints
        run: node scripts/test-ocr-checkpoint.mjs
      - name: Test scanner session persistence
        run: node scripts/test-scanner-session-store.mjs
      - name: Test scanner storage protection
        run: node scripts/test-scanner-storage.mjs
      - name: Test study tools
        run: node scripts/test-study-tools.mjs
      - name: Test persistent study-help cache
        run: node scripts/test-study-help-cache-model.mjs
      - name: Test PWA shell
        run: node scripts/test-pwa.mjs

      - name: Progress 60% - tests complete
        run: echo "[UAB_PROGRESS=60] Cache pronta; test principali completati"

      - name: Stress test 600-page text pipeline
        run: node scripts/stress-large-book.mjs

      - name: Build
        run: |
          npm run build
          echo "[UAB_PROGRESS=75] Build web completata"

      - name: Verify dist
        run: |
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          echo "[UAB_PROGRESS=82] Output dist verificato"

      - name: Validate Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Test Cloudflare runtime and assets
        run: npm run test:cloudflare
        timeout-minutes: 5
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Progress 90% - Cloudflare verified
        run: echo "[UAB_PROGRESS=90] Bundle e runtime Cloudflare verificati"

      - name: Upload temporary LAB/CANDIDATA build output
        if: steps.stage.outputs.stage == 'LAB' || steps.stage.outputs.stage == 'CANDIDATA'
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-${{ steps.stage.outputs.stage }}-${{ github.run_number }}
          retention-days: 14
          path: dist/
          if-no-files-found: error

      - name: Upload deploy source for BASE/MADRE
        if: github.event_name == 'push' && (steps.stage.outputs.stage == 'BASE' || steps.stage.outputs.stage == 'MADRE')
        uses: actions/upload-artifact@v4
        with:
          name: studybook-ai-${{ steps.stage.outputs.stage }}-deploy-source
          retention-days: 3
          include-hidden-files: true
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**

      - name: Progress 95% - handoff ready
        run: echo "[UAB_PROGRESS=95] Output $UAB_STAGE pronto; nessuna promozione implicita eseguita"

      - name: Progress 100% - complete
        run: echo "[UAB_PROGRESS=100] StudyBook UAB-CORE-V1 completato per stage $UAB_STAGE"
