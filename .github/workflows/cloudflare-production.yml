name: Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - candidate/cloudflare-production-01
    paths-ignore:
      - 'netlify.toml'
      - 'netlify/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/build.yml'
      - '.github/workflows/cloudflare-production.yml'
      - 'scripts/test-cloudflare-preview-workflow.mjs'

permissions:
  contents: read

concurrency:
  group: studybook-cloudflare-production
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/candidate/cloudflare-production-01' && contains(github.event.head_commit.message, '[cloudflare-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Credentials preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${AI_API_KEY:-}" || -n "${GEMINI_API_KEY:-}" ]] || missing+=("AI_API_KEY_OR_GEMINI_API_KEY")
          [[ -n "${VITE_POSTHOG_PROJECT_TOKEN:-}" ]] || missing+=("VITE_POSTHOG_PROJECT_TOKEN")

          if (( ${#missing[@]} > 0 )); then
            printf '::error title=MotorLab production preflight::Missing required repository secret: %s\n' "${missing[@]}"
            exit 1
          fi

          echo "MotorLab production credentials: READY"

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build production with error diagnostics
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
          VITE_MOTORLAB_POSTHOG_TEST: '0'
        run: npm run build

      - name: Re-verify Cloudflare package
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler deploy --dry-run
          npm run test:cloudflare

      - name: Deploy Cloudflare production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          EFFECTIVE_AI_KEY="${AI_API_KEY:-${GEMINI_API_KEY:-}}"
          printf 'AI_API_KEY=%s\n' "$EFFECTIVE_AI_KEY" > .cloudflare-production.secrets
          chmod 600 .cloudflare-production.secrets

          WRANGLER_OUTPUT_FILE_PATH=cloudflare-production-result.jsonl npx wrangler deploy --secrets-file .cloudflare-production.secrets

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const records = readFileSync('cloudflare-production-result.jsonl', 'utf8').trim().split('\n').map((line) => JSON.parse(line));
          const result = records.filter((record) => record.type === 'deploy').at(-1);
          if (!result) throw new Error('Risultato deploy mancante nel file strutturato Wrangler.');
          const url = (result.targets || []).find((value) => typeof value === 'string' && value.startsWith('https://') && value.includes('.workers.dev'));
          if (!url) throw new Error('URL di produzione mancante nella risposta Wrangler.');
          writeFileSync('cloudflare-production-url.txt', `${url}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Cloudflare Production\n\n${url}\nVersion: ${result.version_id}\n`);
          NODE

      - name: Verify production assets and real AI
        run: node scripts/smoke-cloudflare-production.mjs

      - name: Publish production URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-Cloudflare-Production
          retention-days: 3
          path: cloudflare-production-url.txt
          if-no-files-found: error

      - name: Remove temporary secret file
        if: always()
        shell: bash
        run: rm -f .cloudflare-production.secrets
