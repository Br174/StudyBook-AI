name: LAB36 compare available free Gemini models for six study editions
on:
  push:
    branches:
      - lab/studybook-core-android-01-update-36-reduction-pdf-reflow-20261106
    paths:
      - .github/workflows/lab36-free-editions-model-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GEMINI_KEY_A: AI_SECRET_PLACEHOLDER
      GEMINI_KEY_B: GEMINI_SECRET_PLACEHOLDER
    steps:
      - name: Two free model requests to generate six structured editions of a safe example
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.GEMINI_KEY_A||process.env.GEMINI_KEY_B;
          if(!key)throw Error('Gemini key not available');
          const source='Articolo 7: la regola non si applica alle persone di età inferiore a 18 anni, salvo che ricorra una specifica eccezione prevista dalla legge. La data della modifica è il 12 marzo 2026.';
          const system='Genera SEI versioni indipendenti dallo stesso originale, senza alterare negazioni, condizioni, numeri, date o eccezioni. Riduzioni desiderate 10 20 30 40 50 percento, più riassunto. Rispondi solo JSON con la chiave editions che contiene stringhe non vuote 10,20,30,40,50,summary.';
          const models=['gemini-3.5-flash','gemini-3.5-flash-lite'];
          const report=[];
          const safe=v=>/^[a-z0-9_.\/:-]{1,160}$/i.test(String(v||''))?String(v):null;
          for(const model of models){
            let result={model,status:'not_checked',allSix:false,nonPreserved:false,
              fourteenPreserved:false,datePreserved:false,reason:null};
            try{
              const response=await fetch('https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',{
                method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},
                body:JSON.stringify({model,temperature:0.1,max_tokens:1800,
                  messages:[{role:'system',content:system},{role:'user',content:source}]}),
                signal:AbortSignal.timeout(50000)});
              result.status=response.status;
              const body=await response.json().catch(()=>null);
              if(response.ok){
                const raw=String(body?.choices?.[0]?.message?.content||'');
                const parsed=JSON.parse(raw.replace(/^\s*`{3}(?:json)?\s*/i,'').replace(/\s*`{3}\s*$/,''));
                const editions=parsed?.editions||{};
                result.allSix=['10','20','30','40','50','summary'].every(id=>typeof editions[id]==='string'&&editions[id].trim());
                result.nonPreserved=Object.values(editions).every(x=>/\bnon\b/i.test(x));
                result.fourteenPreserved=Object.values(editions).every(x=>/\b18\b/.test(x));
                result.datePreserved=Object.values(editions).every(x=>/\b2026\b/.test(x));
              }else{
                result.reason=safe(body?.error?.status)||'HTTP_ERROR';
              }
            }catch(e){result.reason=safe(e?.name)||'UNEXPECTED_ERROR';}
            // Never include source text, generated text, credentials, or raw upstream error in logs.
            report.push(result);
            console.log('SAFE_SIX_EDITION_MODEL_PROOF '+JSON.stringify(result));
            if(model!==models.at(-1))await new Promise(resolve=>setTimeout(resolve,5500));
          }
          const fs=await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## LAB36 free Gemini model proof\n\n'+
            '| Model | HTTP | Six JSON editions | Negative qualifier | Age | Year |\n|---|---:|---|---|---|---|\n'+
            report.map(x=>'| '+x.model+' | '+x.status+' | '+x.allSix+' | '+x.nonPreserved+
              ' | '+x.fourteenPreserved+' | '+x.datePreserved+' |').join('\n')+
            '\n\nNo secrets or user book contents were sent or logged.\n');
          NODE
