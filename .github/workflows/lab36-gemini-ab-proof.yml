name: LAB36 Gemini full six-edition free model viability
on:
  push:
    branches:
      - lab/studybook-core-android-01-update-36-reduction-pdf-reflow-20261106
    paths:
      - .github/workflows/lab36-gemini-ab-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      LAB36_AI_KEY: AI_PLACEHOLDER
      LAB36_GEMINI_KEY: GEMINI_PLACEHOLDER
    steps:
      - name: Test six independent editions with no artificial max-token cap
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.LAB36_AI_KEY||process.env.LAB36_GEMINI_KEY;
          if(!key)throw Error('Test secret absent');
          const text='Articolo 7: la regola non si applica alle persone di età inferiore a 18 anni, salvo che ricorra una specifica eccezione prevista dalla legge. La modifica è del 12 marzo 2026.';
          const prompt=[
            'Sei il motore generativo editoriale di StudyBook AI.',
            'Genera SEI edizioni indipendenti del testo fonte: 10,20,30,40,50 e summary.',
            'Ogni edizione nasce direttamente dall’originale, non dalle altre edizioni.',
            'Le riduzioni sono desiderate, non obbligatorie. Conserva negazioni, condizioni, eccezioni, numeri e date.',
            'Rispondi SOLO con JSON, oggetto editions contenente le sei chiavi 10,20,30,40,50,summary, ciascuna stringa non vuota.'
          ].join('\n');
          const models=['gemini-3.5-flash','gemini-3.5-flash-lite'];
          const safe=x=>String(x||'').replace(/[A-Za-z0-9_-]{25,}/g,'[redacted]').slice(0,140);
          for(const model of models){
            let result={model,http:null,validSix:false,negativePresent:false,agePresent:false,hasResponse:false,reason:null};
            try{
              const response=await fetch('https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',{
                method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},
                body:JSON.stringify({model,temperature:0.1,
                  messages:[{role:'system',content:prompt},{role:'user',content:JSON.stringify({source:text})}]}),
                signal:AbortSignal.timeout(35000)});
              result.http=response.status;
              const raw=await response.text();
              let payload=null;try{payload=JSON.parse(raw)}catch{}
              if(response.ok){
                const textOut=String(payload?.choices?.[0]?.message?.content||'');
                result.hasResponse=Boolean(textOut.trim());
                let parsed=null;
                try{parsed=JSON.parse(textOut.replace(/^\s*\x60{3}(?:json)?\s*/i,'').replace(/\s*\x60{3}$/,''))}catch{}
                const ed=parsed?.editions||{};
                result.validSix=['10','20','30','40','50','summary'].every(k=>typeof ed[k]==='string'&&ed[k].trim());
                result.negativePresent=result.validSix&&Object.values(ed).every(v=>/\bnon\b/i.test(v));
                result.agePresent=result.validSix&&Object.values(ed).every(v=>/\b18\b/.test(v));
              }else{
                const e=Array.isArray(payload)?payload[0]?.error:payload?.error;
                result.reason=safe(e?.message||e?.status||'HTTP_ERROR');
              }
            }catch(e){result.reason=safe(e.name||'NETWORK_ERROR');}
            console.log('SAFE_LAB36_FULL_SIX '+JSON.stringify(result));
            if(model!==models.at(-1))await new Promise(resolve=>setTimeout(resolve,6500));
          }
          NODE
