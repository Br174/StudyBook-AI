name: LAB36 Gemini six-edition bounded output proof
on:
  push:
    branches:
      - lab/studybook-core-android-01-update-36-reduction-pdf-reflow-20261106
    paths:
      - .github/workflows/lab36-gemini-ab-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      LAB36_AI_KEY: ${{ secrets.AI_API_KEY }}
      LAB36_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Compare safe output caps for six independent study editions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.LAB36_AI_KEY||process.env.LAB36_GEMINI_KEY;
          if(!key)throw Error('Missing Gemini key');
          const source='Articolo 7: la regola non si applica ai minori di 18 anni, salvo eccezione prevista dalla legge.';
          const prompt='Rispondi SOLO JSON con {"editions":{"10":"...","20":"...","30":"...","40":"...","50":"...","summary":"..."}}. Genera sei versioni indipendenti dall’originale, conserva negazioni e numero 18. Riduci solo quando possibile senza perdita di senso.';
          for(const cap of [512,1024]){
            const output={model:'gemini-3.5-flash-lite',max_tokens:cap,http:null,allSix:false,
              negativeAll:false,ageAll:false,hasOutput:false,error:null};
            try{
              const response=await fetch('https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',{
                method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},
                body:JSON.stringify({model:'gemini-3.5-flash-lite',temperature:0.1,max_tokens:cap,
                  messages:[{role:'system',content:prompt},{role:'user',content:source}]}),
                signal:AbortSignal.timeout(30000)});
              output.http=response.status;
              const raw=await response.text();
              let payload=null;try{payload=JSON.parse(raw)}catch{}
              if(response.ok){
                const v=String(payload?.choices?.[0]?.message?.content||'');
                output.hasOutput=Boolean(v.trim());
                let parsed;try{parsed=JSON.parse(v.replace(/^\s*\x60{3}(?:json)?\s*/i,'').replace(/\s*\x60{3}$/,''))}catch{}
                const ed=parsed?.editions||{};
                output.allSix=['10','20','30','40','50','summary'].every(k=>typeof ed[k]==='string'&&ed[k].trim());
                output.negativeAll=output.allSix&&Object.values(ed).every(x=>/\bnon\b/i.test(x));
                output.ageAll=output.allSix&&Object.values(ed).every(x=>/\b18\b/.test(x));
              }else{
                const error=Array.isArray(payload)?payload[0]?.error:payload?.error;
                output.error=String(error?.message||error?.status||'HTTP_ERROR').slice(0,110);
              }
            }catch(e){output.error=String(e?.name||'NETWORK_ERROR').slice(0,90)}
            console.log('SAFE_LAB36_BOUNDED_SIX '+JSON.stringify(output));
            if(cap===512)await new Promise(resolve=>setTimeout(resolve,6500));
          }
          NODE
