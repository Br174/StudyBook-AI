name: StudyBook LAB36 isolated Gemini staging
on:
  push:
    branches:
      - lab/studybook-core-android-01-update-36-reduction-pdf-reflow-20261106
    paths:
      - .github/workflows/lab36-worker-staging.yml
      - api/editionsV36.js
      - src/lib/generativeEditionsV36.js
      - api/geminiQuotaV36.js
      - wrangler.jsonc
      - worker/index.js
  workflow_dispatch:
concurrency:
  group: studybook-lab36-isolated-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_AI_KEY: ${{ secrets.AI_API_KEY }}
      GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and Cloudflare dry-run checks
        run: |
          npm install --no-audit --no-fund
          node scripts/test-lab36-generative-backend.mjs
          node scripts/test-lab36-quota-diagnosis.mjs
          node scripts/test-lab36-quota-controller.mjs
          node scripts/test-lab36-generative-store.mjs
          node scripts/test-lab36-single-edition.mjs
          npm run build
          npx wrangler deploy --dry-run
      - name: Publish only the separate LAB36 worker and attach existing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}"
          printf '%s' "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}" | npx wrangler secret put AI_API_KEY --name studybook-ai-lab36
          npx wrangler deploy --name studybook-ai-lab36 > lab36-deploy-output.txt
          cat lab36-deploy-output.txt
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const log=readFileSync('lab36-deploy-output.txt','utf8');
          const candidates=[...log.matchAll(/https:\/\/[a-z0-9.-]+\.workers\.dev/gi)].map(match=>match[0]);
          const url=candidates.find(value=>value.includes('studybook-ai-lab36.'));
          if(!url)throw Error('LAB36 staging endpoint missing in Wrangler output');
          writeFileSync('lab36-worker-url.txt',url+'\n');
          NODE
      - name: Verify LAB36 route availability after new-worker publication
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const url=readFileSync('lab36-worker-url.txt','utf8').trim();
          let last='none';
          for(let i=0;i<20;i++){
            try{
              const response=await fetch(url+'/api/editions/v36',{method:'GET',signal:AbortSignal.timeout(12000)});
              last=String(response.status);
              if(response.status===405){console.log('LAB36_STAGING_ROUTE=READY');process.exit(0);}
              if(response.status!==404)break;
            }catch(error){last=String(error?.name||'network');}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          throw Error('LAB36 worker route is not ready: '+last);
          NODE
      - name: Live Gemini single-probe with explicit free quota proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const url=readFileSync('lab36-worker-url.txt','utf8').trim();
          const source='La fotosintesi utilizza luce, acqua e anidride carbonica per produrre zuccheri e ossigeno. Gli zuccheri conservano energia chimica.';
          const summary=process.env.GITHUB_STEP_SUMMARY;
          async function route(path){
            const response=await fetch(url+path,{method:'GET',signal:AbortSignal.timeout(15000)});
            if(response.status!==405)throw Error('Missing LAB36 API route '+path+' status='+response.status);
          }
          await route('/api/summarize');
          await route('/api/editions/v36');
          // One genuine generation attempt at most, never a paid retry loop.
          const response=await fetch(url+'/api/editions/v36',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({source,level:'10',context:{chapterTitle:'Biologia'}}),
            signal:AbortSignal.timeout(90000)});
          const data=await response.json().catch(()=>null);
          if(response.ok){
            if(typeof data?.editions?.['10']!=='string'||!data.editions['10'].trim())
              throw Error('Gemini single-edition generation incomplete');
            if(data.engine!=='ai'||data.sourceVersion!=='original')throw Error('Non-generative output');
            appendFileSync(summary,'## LAB36 staged Gemini\n\nReal Gemini single-edition generation: PASSED; six-level pipeline checked separately.\n\nProduction Worker unchanged.\n');
            console.log('LIVE_LAB36_SIX_EDITIONS=PASS');
          }else if([429,503].includes(response.status)){
            if(!['AI_QUOTA_LIMIT','AI_QUOTA_MANUAL_REVIEW','AI_TEMPORARY_OVERLOAD'].includes(data?.code)
              ||typeof data?.quota?.kind!=='string')
              throw Error('Gemini quota error lacks safe classified details');
            const tag=data.quota.automatic?'AUTO_WAIT':'MANUAL_QUOTA_REVIEW';
            appendFileSync(summary,'## LAB36 staged Gemini\n\nQuota classification: PASSED ('+
              data.quota.kind+').\n\nReal Gemini single-edition generation: **NOT VERIFIED**, quota currently blocked.\n\n'+
              'Response has no secret value. Production Worker unchanged.\n');
            console.log('LIVE_LAB36_QUOTA_DIAGNOSTIC=PASS '+tag+' kind='+data.quota.kind);
          }else throw Error('Unexpected Gemini staging response '+response.status+' code='+(data?.code||'unknown'));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StudyBook-LAB36-Staging-Worker-URL
          path: lab36-worker-url.txt
          retention-days: 30
          if-no-files-found: error
