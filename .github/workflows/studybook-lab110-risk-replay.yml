name: StudyBook LAB110 - source relation risk postflight replay
on:
  push:
    branches:
      - audit/studybook-source-ledger-v110-20261110
    paths:
      - .github/workflows/studybook-lab110-risk-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-risks-without-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify files compile
        run: |
          node --check src/lib/studySourceRiskV110.js
          node --check api/editionsBulkV51.js
          node --check scripts/test-lab110-source-risk-replay.mjs
      - name: Risk replay, six source cases plus three adversarial mutations
        run: node scripts/test-lab110-source-risk-replay.mjs
      - name: Actual Worker LAB110 and LAB110B regression with source-risk no-study hold
        run: |
          node scripts/test-lab110-source-ledger-contract.mjs
          node scripts/test-lab110b-worker-contract.mjs
