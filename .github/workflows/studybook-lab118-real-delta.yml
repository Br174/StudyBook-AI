name: StudyBook LAB118 - ONE free real source-delta request
on:
  push:
    branches:
      - research/studybook-lab118-claim-ledger-20261111
    paths:
      - .github/workflows/studybook-lab118-real-delta.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-real-delta-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated source code before contacting provider
        run: |
          node --check src/lib/studySourcePatchV118.js
          node --check scripts/test-lab118-real-source-delta.mjs
      - name: ONE free Gemini request on public test fixtures only, no retry
        env:
          AI_TEST_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY }}
        run: node scripts/test-lab118-real-source-delta.mjs
      - name: Preserve all data even on quality failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAB118-One-Real-Source-Delta-Evidence
          path: audit/reports/lab118-one-real-source-patches.json
          if-no-files-found: error
          retention-days: 30
