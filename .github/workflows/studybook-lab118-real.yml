name: StudyBook LAB118 - ONE free Gemini source-claim proof
on:
  push:
    branches:
      - research/studybook-lab118-claim-ledger-20261111
    paths:
      - .github/workflows/studybook-lab118-real.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No model contact before verifying scripts
        run: |
          node --check src/lib/studyClaimLedgerV118.js
          node --check scripts/test-lab118-one-real-call.mjs
      - name: One free Gemini request against two public synthetic pages, no retry
        env:
          AI_TEST_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY }}
        run: node scripts/test-lab118-one-real-call.mjs
      - name: Preserve original model reply and failed quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAB118-One-Free-Gemini-Source-Claims
          path: audit/reports/lab118-one-real-claim-evidence.json
          if-no-files-found: error
          retention-days: 30
