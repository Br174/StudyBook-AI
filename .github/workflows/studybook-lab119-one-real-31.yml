name: StudyBook LAB119B - one free 3.1 Flash Lite semantic ladder
on:
  push:
    branches:
      - research/studybook-lab119-semantic-ladder-20261111
    paths:
      - .github/workflows/studybook-lab119-one-real-31.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-existing-free-key:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify provenance and script syntax
        run: |
          node --check src/lib/studySemanticLadderV119.js
          node --check scripts/test-lab119-one-real-gemini-31.mjs
      - name: One real free Gemini 3.1 Flash Lite request, no retries, public samples
        env:
          AI_TEST_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY }}
        run: node scripts/test-lab119-one-real-gemini-31.mjs
      - name: Retain all outputs and failure diagnoses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAB119B-ONE-FREE-GEMINI-31-EVIDENCE
          path: audit/reports/lab119-one-real-response-31.json
          if-no-files-found: error
          retention-days: 30
