name: StudyBook LAB119 - forensic replay real response without model
on:
  push:
    branches:
      - research/studybook-lab119-semantic-ladder-20261111
    paths:
      - .github/workflows/studybook-lab119-replay.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  detect-filler:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover original exact model output, no new requests
        uses: actions/download-artifact@v4
        with:
          name: LAB119-ONE-REAL-GEMINI-CORE-EXPANSIONS
          repository: Br174/StudyBook-AI
          run-id: 42985330555
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit/reports
      - name: Prove real model produced filler not study content
        run: |
          set -euo pipefail
          node --check scripts/replay-lab119-placeholders.mjs
          node scripts/replay-lab119-placeholders.mjs | tee lab119-replay-log.json
      - name: Preserve findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAB119-Replay-Real-Placeholder-Gate
          path: |
            audit/reports/lab119-replay-placeholder-diagnosis.json
            lab119-replay-log.json
          if-no-files-found: ignore
          retention-days: 30
