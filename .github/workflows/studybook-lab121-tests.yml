name: StudyBook LAB121 - isolated private bands real Worker mock and regressions
on:
  push:
    branches:
      - trial/studybook-lab121-private-bands-android-20261111
    paths:
      - .github/workflows/studybook-lab121-tests.yml
      - src/lib/studyPrivatePromptV121.js
      - src/lib/studyRebalancePolicyV67.js
      - src/lib/integralPlannerV51.js
      - src/lib/studyLinearPlannerV111.js
      - src/lib/draftFirstV57.js
      - api/editionsBulkV51.js
      - scripts/test-lab121-private-worker.mjs
      - scripts/test-lab72-negative-closure.mjs
      - scripts/test-lab69-strict-bands.mjs
      - scripts/test-lab67-simplified-precise-rebalance.mjs
      - scripts/test-lab109-worker-contract.mjs
      - scripts/test-lab110-source-ledger-contract.mjs
      - scripts/test-lab110b-worker-contract.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS source syntax
        run: |
          node --check src/lib/studyPrivatePromptV121.js
          node --check src/lib/studyRebalancePolicyV67.js
          node --check src/lib/integralPlannerV51.js
          node --check src/lib/draftFirstV57.js
          node --check api/editionsBulkV51.js
          node --check scripts/test-lab121-private-worker.mjs
      - name: Install project dependencies for native LAB79 no-loop test
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build real Vite web assets required by native Cloudflare Worker test harness
        run: npm run build
      - name: Six-level Worker request privacy and numeric center contract
        run: |
          set -euo pipefail
          node scripts/test-lab121-private-worker.mjs | tee lab121-worker-test.json
      - name: Scudo360 P1 native quality and source fidelity tests
        run: node .motorlab/regression/scudo360-gate.mjs .motorlab/scudo360-contracts.json lab .motorlab/trial121-scudo-report.json
      - name: Historical LAB109 LAB110 LAB110B Worker contracts against LAB121 canonical center
        run: |
          set -euo pipefail
          node scripts/test-lab109-worker-contract.mjs
          node scripts/test-lab110-source-ledger-contract.mjs
          node scripts/test-lab110b-worker-contract.mjs
          node scripts/test-lab110-source-risk-replay.mjs
          node scripts/test-lab113-traffic-pacing.mjs
      - name: Existing LAB114 one-shot 503 preservation
        run: node scripts/test-lab114-one-shot-failover.mjs
      - name: Existing LAB111 one-call per natural block
        run: node scripts/test-lab111-lean-worker.mjs
      - name: Existing LAB111 2000-page source planner
        run: node scripts/test-lab111-2000-pages.mjs
      - name: Existing LAB79 quality and no-loop invariant
        run: node scripts/test-lab79-quality-no-loop.mjs
      - name: Preserve evidence even when gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAB121-Worker-Privacy-Quality-Regressions
          path: lab121-worker-test.json
          if-no-files-found: ignore
          retention-days: 30
