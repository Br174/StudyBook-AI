name: StudyBook LAB72 calibrated two-pass proof
on:
  push:
    branches:
      - 'lab/studybook-core-android-01-update-72-*'
    paths:
      - '.github/workflows/studybook-lab72-calibrated-proof.yml'
permissions:
  contents: read
jobs:
  calibrated-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Offline targeted repair and six-band guards
        run: |
          node scripts/test-lab72-targeted-repair.mjs
          node scripts/test-lab72-negative-closure.mjs
      - name: One synthetic free-key sample, two localized tri-choice calls at most
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/test-lab72-real-two-pass.mjs
