name: StudyBook LAB72 one controlled Gemini targeted probe
on:
  push:
    branches:
      - 'lab/studybook-core-android-01-update-72-*'
    paths:
      - '.github/workflows/studybook-lab72-live-probe.yml'
permissions:
  contents: read
jobs:
  one-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Confirm offline regressions before provider call
        run: |
          node scripts/test-lab72-targeted-repair.mjs
          node scripts/test-lab72-negative-closure.mjs
      - name: ONE existing free-tier Gemini targeted-repair probe, synthetic text
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/test-lab72-real-repair-probe.mjs
