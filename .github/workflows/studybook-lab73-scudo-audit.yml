name: StudyBook LAB73 Scudo360 native pre-release audit
on:
  push:
    branches: ['audit/studybook-lab73-network-preflight-*']
    paths: ['.github/workflows/studybook-lab73-scudo-audit.yml']
permissions:
  contents: read
jobs:
  scudo:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MotorLab native guard self-test
        run: node scripts/motorlab-active-guard.mjs --self-test
      - name: Install existing project dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Build isolated browser core
        run: npm run build
      - name: Mandatory Scudo360 JUnit contracts on this exact source
        run: node .motorlab/regression/scudo360-gate.mjs .motorlab/scudo360-contracts.json lab .motorlab/scudo360-lab73-audit.json
      - name: R40 request-to-native-class quality proof
        run: node .motorlab/regression/scudo360-quality-r40.mjs .motorlab/scudo360-contracts.json .motorlab/scudo360-lab73-audit.json .motorlab/scudo360-r40-plan.json .motorlab/scudo360-lab73-quality.json
      - name: Reject missing P1/untested classes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('.motorlab/scudo360-lab73-audit.json','utf8'));
          assert.equal(r.passed,true);
          const id='studybook.lab73-first-draft-fidelity-and-network-recovery';
          const c=r.contracts.find(x=>x.id===id);
          assert.equal(c?.status,'passed');
          assert.ok(c.classEvidence?.some(x=>x.name==='studybook.StudyBookLab73Network'&&x.passed));
          console.log('LAB73_SCUDO_P1_CONFIRMED',JSON.stringify({sha:r.commit,required:r.contracts.filter(c=>c.required).length}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: StudyBook-LAB73-Scudo-P1-evidence
          path: |
            .motorlab/scudo360-lab73-audit.json
            .motorlab/scudo360-lab73-quality.json
            .motorlab/scudo360-test-results/TEST-*.xml
          retention-days: 30
