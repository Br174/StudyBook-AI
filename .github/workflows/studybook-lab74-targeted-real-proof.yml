name: StudyBook LAB74 targeted Gemini page recalibration proof
on:
  push:
    branches: ['lab/studybook-core-android-01-update-74-*']
    paths:
      - '.github/workflows/studybook-lab74-targeted-real-proof.yml'
      - 'scripts/test-lab74-real-targeted-recalibration.mjs'
permissions:
  contents: read
jobs:
  synthetic-free-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Validate canonical budgets and phase-two numeric gap without contacting provider
        run: |
          node scripts/test-lab74-page-letter-budgets.mjs
          node scripts/test-lab74-recalibration-feedback.mjs
      - name: Build isolated test Worker assets
        run: npm run build
      - name: Deploy only free-tier isolated LAB74 QA Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_AI_KEY: ${{ secrets.AI_API_KEY }}
          GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}"
          printf '%s' "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}" | npx wrangler secret put AI_API_KEY --name studybook-ai-lab74-qa
          npx wrangler deploy --config wrangler.lab74-qa.jsonc
      - name: REAL free Gemini phase one plus measured per-page corrective phase
        env:
          STUDYBOOK_PROBE_BASE: https://studybook-ai-lab74-qa.brunoverlezza.workers.dev
        run: node scripts/test-lab74-real-targeted-recalibration.mjs
