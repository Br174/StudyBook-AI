name: StudyBook LAB75 one controlled real Gemini A/B
on:
  push:
    branches:
      - 'lab/studybook-core-android-01-update-75-*'
    paths:
      - '.github/workflows/studybook-lab75-real-ab.yml'
permissions:
  contents: read
jobs:
  actual-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without modifying sources
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Verify LAB75 two stages and LAB74 six-number source budget compatibility
        run: |
          node scripts/test-lab75-two-prompt-offline.mjs
          node scripts/test-lab74-page-letter-budgets.mjs
          node scripts/test-lab74-selective-pages.mjs
      - name: Build isolated QA assets (no APK)
        run: npm run build
      - name: Deploy one isolated free-tier Gemini comparison Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_AI_KEY: ${{ secrets.AI_API_KEY }}
          GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}"
          printf '%s' "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}" | npx wrangler secret put AI_API_KEY --name studybook-ai-lab75-qa
          npx wrangler deploy --config wrangler.lab75-qa.jsonc
      - name: SAME SOURCE and SAME free Gemini, six total calls maximum
        env:
          STUDYBOOK_TEST_WORKER_BASE: https://studybook-ai-lab75-qa.brunoverlezza.workers.dev
        run: node scripts/test-lab75-real-ab.mjs
