name: StudyBook MotorLab LAB77 real Gemini numbering comparison
on:
  push:
    branches:
      - 'audit/studybook-gemini-numbering-v77-*'
    paths:
      - '.github/workflows/studybook-lab77-numbering-proof.yml'
permissions:
  contents: read
jobs:
  real-numbering:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project dependencies without changing lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Verify source-based page budgets and marker parser before any Gemini call
        run: |
          node scripts/test-lab77-numbering-offline.mjs
          node scripts/test-lab74-page-letter-budgets.mjs
          node scripts/test-lab74-selective-pages.mjs
      - name: Build isolated QA Worker assets (no Android or app release)
        run: npm run build
      - name: Configure and deploy only experiment QA Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_AI_KEY: ${{ secrets.AI_API_KEY }}
          GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}"
          printf '%s' "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}" | npx wrangler secret put AI_API_KEY --name studybook-ai-numbering-qa
          npx wrangler deploy --config wrangler.numbering-qa.jsonc
      - name: Controlled real free Gemini counting comparison, 18 requests max
        env:
          STUDYBOOK_COUNTING_QA_URL: https://studybook-ai-numbering-qa.brunoverlezza.workers.dev
        run: node scripts/test-lab77-real-numbering.mjs
      - name: Publish structured numeric results even if quota prevents full run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-LAB77-Gemini-Numbering-Experiment
          path: studybook-lab77-numbering-report.json
          if-no-files-found: ignore
          retention-days: 30
