name: StudyBook LAB78 TRUE Gemini Worker six-level live gate (free only)
on:
  push:
    branches:
      - 'lab/studybook-core-android-01-update-78-*'
    paths:
      - '.github/workflows/studybook-lab78-live-worker-gate.yml'
      - 'scripts/test-lab78-real-worker-six-levels.mjs'
      - 'src/lib/studyGeometryV78.js'
      - 'src/lib/studyBestOfV76.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studybook-lab78-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-model-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared packages without lockfile churn
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Require exact Worker generation prompt + native row gate offline
        run: node scripts/test-lab78-real-worker-parity.mjs
      - name: Deploy only LAB78 isolated Gemini Worker with pre-existing free credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_AI_KEY: ${{ secrets.AI_API_KEY }}
          GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Free Cloudflare credential not connected"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Cloudflare account not connected"; exit 1; }
          test -n "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}" || { echo "::error::Pre-existing Gemini free key missing"; exit 1; }
          npm run build
          printf '%s' "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}" | npx wrangler secret put AI_API_KEY --name studybook-ai-lab78-geometry
          npx wrangler deploy --config wrangler.lab78-geometry.jsonc
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://studybook-ai-lab78-geometry.brunoverlezza.workers.dev/api/editions/bulk/v51';
          let ok=false;
          for(let i=0;i<12;i++){
           try{
             const r=await fetch(url,{method:'GET',signal:AbortSignal.timeout(10000)});
             if(r.status===405&&r.headers.get('X-StudyBook-Geometry-Policy')==='lab78-real-worker-60-cell-source-pages-v1'){
               ok=true;break;
             }
           }catch{}
           await new Promise(resolve=>setTimeout(resolve,1500));
          }
          assert(ok,'LAB78 live Worker not running actual geometry code');
          console.log('LAB78_LIVE_WORKER_CODE_MATCH_VERIFIED');
          NODE
      - name: REAL Gemini six reductions on same fresh synthetic pages, stop on free quota
        env:
          LAB78_URL: https://studybook-ai-lab78-geometry.brunoverlezza.workers.dev
          LAB78_REAL_REPORT: audit/reports/lab78-real-worker-six-levels-r2.json
        run: node scripts/test-lab78-real-worker-six-levels.mjs
      - name: Preserve actual provider results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-LAB78-Real-Gemini-SixLevel-Gate
          path: audit/reports/lab78-real-worker-six-levels-r2.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Record strictly isolated LAB78 experimental evidence
        if: always()
        env:
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/reports/lab78-real-worker-six-levels-r2.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/reports/lab78-real-worker-six-levels-r2.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(LAB78): genuine live provider results, green only when all six pass'
            git fetch origin "${TARGET_REF}"
            git rebase "origin/${TARGET_REF}"
            git push origin "HEAD:${TARGET_REF}"
          fi
