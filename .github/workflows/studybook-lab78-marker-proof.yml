name: StudyBook LAB78 bounded real Gemini marker checkpoint comparison
on:
  push:
    branches:
      - 'audit/studybook-gemini-markergen-v78-*'
    paths:
      - '.github/workflows/studybook-lab78-marker-proof.yml'
permissions:
  contents: read
jobs:
  marker-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing dependencies without changes to lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Validate marker and page-budget safeguards offline
        run: |
          node scripts/test-lab78-marker-offline.mjs
          node scripts/test-lab77-numbering-offline.mjs
          node scripts/test-lab74-page-letter-budgets.mjs
          node scripts/test-lab74-selective-pages.mjs
      - name: Build only QA Worker assets (never Android)
        run: npm run build
      - name: Deploy isolated existing free-tier Gemini Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_AI_KEY: ${{ secrets.AI_API_KEY }}
          GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}"
          printf '%s' "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}" | npx wrangler secret put AI_API_KEY --name studybook-ai-markers-qa
          npx wrangler deploy --config wrangler.markers-qa.jsonc
      - name: Real model same-source comparison maximum 12 generations
        env:
          STUDYBOOK_MARKER_QA_URL: https://studybook-ai-markers-qa.brunoverlezza.workers.dev
        run: node scripts/test-lab78-real-markers.mjs
      - name: Preserve numeric results also after quota/partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-LAB78-MarkerGen-Experiment-Results
          path: studybook-lab78-markers-report.json
          if-no-files-found: ignore
          retention-days: 30
