name: StudyBook LAB79 matched fixed20 markers versus control (real Gemini)
on:
  push:
    branches:
      - 'audit/studybook-fixed20-repeat-v79-*'
    paths:
      - '.github/workflows/studybook-lab79-fixed20-repeat.yml'
permissions:
  contents: read
jobs:
  fixed20-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies, preserving project lock file
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Offline controlled comparison and existing source-budget tests
        run: |
          node scripts/test-lab79-matched-control-offline.mjs
          node scripts/test-lab78-marker-offline.mjs
          node scripts/test-lab77-numbering-offline.mjs
          node scripts/test-lab74-page-letter-budgets.mjs
          node scripts/test-lab74-selective-pages.mjs
      - name: Build QA Worker assets only, no APK
        run: npm run build
      - name: Deploy one isolated free-tier Gemini QA Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_AI_KEY: ${{ secrets.AI_API_KEY }}
          GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}"
          printf '%s' "${GH_AI_KEY:-${GH_GEMINI_KEY:-}}" | npx wrangler secret put AI_API_KEY --name studybook-ai-fixed20-v79-qa
          npx wrangler deploy --config wrangler.fixed20-v79-qa.jsonc
      - name: Five levels and three texts same-source paired comparison (max 30 calls)
        env:
          STUDYBOOK_FIXED20_QA_URL: https://studybook-ai-fixed20-v79-qa.brunoverlezza.workers.dev
        run: node scripts/test-lab79-fixed20-repeat.mjs
      - name: Always preserve source-matched comparison, including quota stoppage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-LAB79-Fixed20-Matched-Comparison
          path: studybook-lab79-fixed20-report.json
          if-no-files-found: ignore
          retention-days: 30
