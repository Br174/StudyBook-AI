name: StudyBook LAB82 real Gemini virtual-line comparison
on:
  push:
    branches:
      - 'audit/studybook-line-budget-v82-*'
    paths:
      - 'scripts/test-lab82-virtual-lines.mjs'
      - '.github/workflows/studybook-lab82-virtual-lines.yml'
permissions:
  contents: write
concurrency:
  group: studybook-lab82-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and local preflight
        run: node --check scripts/test-lab82-virtual-lines.mjs
      - name: Run real Gemini bound to existing free credential only
        env:
          AI_TEST_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY }}
        run: node scripts/test-lab82-virtual-lines.mjs
      - name: Upload complete or partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyBook-LAB82-VirtualLines-Gemini
          path: audit/reports/lab82-virtual-lines-gemini.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve results in audit branch only
        if: always()
        shell: bash
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f audit/reports/lab82-virtual-lines-gemini.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/reports/lab82-virtual-lines-gemini.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(LAB82): preserve isolated virtual-line Gemini evidence'
            git push origin "HEAD:${TARGET_REF}"
          fi
